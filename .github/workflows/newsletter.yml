name: Newsletter

on:
  schedule:
    - cron: "7 6 * * 1,3,5" # Mon, Wed, Fri at 06:07 UTC (08:07 in Madrid in summer, 07:07 in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: newsletter issue"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
