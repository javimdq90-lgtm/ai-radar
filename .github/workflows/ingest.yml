name: Ingest

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

# Ingest and newsletter both commit to data/, so they never run at the same time.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Commit even when enrichment failed, so fetched links aren't lost; they're enriched next run.
      - name: Commit data
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: ingest $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
