name: Ingest

on:
  schedule:
    - cron: "17 5,17 * * *" # every 12 hours, 05:17 and 17:17 UTC (just before the 06:07 newsletter)
  workflow_dispatch:
    inputs:
      redo:
        description: Re-enrich the last few days (after changing a prompt)
        type: boolean
        default: false
      rebrief:
        description: Rewrite the current briefings (after changing the briefing prompt)
        type: boolean
        default: false

permissions:
  contents: write

# Ingest and newsletter both commit to data/, so they never run at the same time.
concurrency:
  group: data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest -- ${{ inputs.redo && '--redo' || '' }} ${{ inputs.rebrief && '--rebrief' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Commit even when enrichment failed, so fetched links aren't lost; they're enriched next run.
      - name: Commit data
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: ingest $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
